<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bus Management | BusTrack</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/glass.css">
    <link rel="stylesheet" href="../css/admin/admin.css">
    <link rel="stylesheet" href="../css/admin/tables.css">
    <link rel="stylesheet" href="../css/admin/forms.css">

</head>

<body>

    <!-- HEADER -->

    <header class="admin-header">

        <div class="admin-header-left">

            <div class="admin-logo">
                🚌
            </div>

            <div>
                <h1>BusTrack</h1>
                <span>Admin Portal</span>
            </div>

        </div>


        <div class="admin-header-right">

            <span class="admin-status">
                ● Admin
            </span>

            <button
                type="button"
                class="admin-profile-btn"
            >
                A
            </button>

        </div>

    </header>


    <!-- MAIN -->

    <main class="admin-container">


        <!-- PAGE TITLE -->

        <section class="admin-page-title">

            <div>

                <p class="small-label">
                    BUS MANAGEMENT
                </p>

                <h2>
                    Buses
                </h2>

                <p>
                    Create and manage all college buses.
                </p>

            </div>


            <button
                type="button"
                id="addBusBtn"
                class="primary-btn"
            >
                + Add Bus
            </button>

        </section>


        <!-- STATS -->

        <section class="admin-stats">

            <div class="stat-card">

                <span>
                    Total Buses
                </span>

                <strong id="totalBuses">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Active
                </span>

                <strong id="activeBuses">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Maintenance
                </span>

                <strong id="maintenanceBuses">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span>
                    Inactive
                </span>

                <strong id="inactiveBuses">
                    0
                </strong>

            </div>

        </section>


        <!-- ADD / EDIT BUS FORM -->

        <section
            id="busFormSection"
            class="admin-form-card"
            style="display:none;"
        >

            <div class="form-header">

                <div>

                    <p class="small-label">
                        BUS DETAILS
                    </p>

                    <h3 id="busFormTitle">
                        Add New Bus
                    </h3>

                </div>


                <button
                    type="button"
                    id="closeBusForm"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <form id="busForm">

                <input
                    type="hidden"
                    id="busId"
                >


                <div class="form-grid">


                    <!-- BUS NUMBER -->

                    <div class="form-group">

                        <label for="busNumber">
                            Bus Number
                        </label>

                        <input
                            type="text"
                            id="busNumber"
                            placeholder="Example: BUS-01"
                            required
                        >

                    </div>


                    <!-- BUS NAME -->

                    <div class="form-group">

                        <label for="busName">
                            Bus Name
                        </label>

                        <input
                            type="text"
                            id="busName"
                            placeholder="Example: College Express"
                        >

                    </div>


                    <!-- REGISTRATION -->

                    <div class="form-group">

                        <label for="registrationNumber">
                            Registration Number
                        </label>

                        <input
                            type="text"
                            id="registrationNumber"
                            placeholder="Example: TN01AB1234"
                            required
                        >

                    </div>


                    <!-- CAPACITY -->

                    <div class="form-group">

                        <label for="capacity">
                            Capacity
                        </label>

                        <input
                            type="number"
                            id="capacity"
                            placeholder="Example: 50"
                            min="1"
                            required
                        >

                    </div>


                    <!-- STATUS -->

                    <div class="form-group">

                        <label for="status">
                            Status
                        </label>

                        <select id="status">

                            <option value="active">
                                Active
                            </option>

                            <option value="inactive">
                                Inactive
                            </option>

                            <option value="maintenance">
                                Maintenance
                            </option>

                        </select>

                    </div>

                </div>


                <!-- FORM ACTIONS -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="cancelBusForm"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>


                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Bus
                    </button>

                </div>

            </form>

        </section>


        <!-- BUS LIST -->

        <section class="admin-table-card">

            <div class="table-header">

                <div>

                    <p class="small-label">
                        ALL BUSES
                    </p>

                    <h3>
                        Bus List
                    </h3>

                </div>


                <input
                    type="search"
                    id="busSearch"
                    placeholder="Search buses..."
                >

            </div>


            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Bus
                            </th>

                            <th>
                                Registration
                            </th>

                            <th>
                                Capacity
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="busTableBody">

                        <tr>

                            <td
                                colspan="5"
                                class="empty-table"
                            >
                                Loading buses...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>


    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/config/supabase.js"></script>

    <script src="../js/admin/buses.js"></script>

</body>

</html>
