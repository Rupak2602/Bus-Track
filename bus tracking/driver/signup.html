<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Driver Signup - BusTrack</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config/supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f8ff;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 450px;
            background: rgba(255,255,255,0.92);
            border: 1px solid #dce5f5;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(20,40,80,0.12);
        }

        .logo {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            background: #eef4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 20px;
        }

        h1 {
            color: #172b4d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #71809a;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            color: #233858;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d6dfef;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4575d4;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 15px;
            border: none;
            border-radius: 13px;
            background: #1d4ed8;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1742b8;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: #eaf8ef;
            color: #18753c;
        }

        .error {
            display: block !important;
            background: #fff0f0;
            color: #c62828;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #71809a;
        }

        .login a {
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">🚌</div>

    <h1>Driver Signup</h1>

    <p class="subtitle">
        Create your BusTrack driver account
    </p>

    <form id="driverSignupForm">

        <label>Full Name</label>
        <input
            type="text"
            id="fullName"
            placeholder="Enter driver name"
            required
        >

        <label>Phone Number</label>
        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            required
        >

        <label>License Number</label>
        <input
            type="text"
            id="licenseNumber"
            placeholder="TN-XX-XXXXXXXX"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="driver@example.com"
            required
        >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Minimum 6 characters"
            minlength="6"
            required
        >

        <button type="submit">
            Create Driver Account
        </button>

    </form>

    <div id="message"></div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

</div>

<script>

const form = document.getElementById("driverSignupForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    message.className = "";
    message.style.display = "none";
    message.textContent = "";

    const fullName =
        document.getElementById("fullName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const licenseNumber =
        document.getElementById("licenseNumber").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (password.length < 6) {
        showMessage(
            "Password minimum 6 characters irukkanum.",
            "error"
        );
        return;
    }

    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {
                    data: {
                        full_name: fullName,
                        phone: phone,
                        license_number: licenseNumber,
                        role: "driver"
                    }
                }

            });

        if (error) {
            throw error;
        }

        showMessage(
            "Driver account successfully created! 🎉",
            "success"
        );

        form.reset();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1500);

    } catch (error) {

        console.error(error);

        showMessage(
            error.message || "Signup failed.",
            "error"
        );

    }

});


function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";

}

</script>

</body>
</html>
