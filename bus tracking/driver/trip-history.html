
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip History | BusTrack</title>

  <link rel="stylesheet" href="../css/global.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #f4f7fc;
      color: #172b4d;
    }

    header {
      background: #fff;
      padding: 22px 5%;
      border-bottom: 1px solid #e1e8f5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .brand {
      font-size: 25px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      color: #7184a3;
      font-size: 14px;
    }

    a {
      text-decoration: none;
    }

    .back-btn {
      background: #eaf0fc;
      color: #203b66;
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 700;
    }

    main {
      width: min(1000px, 92%);
      margin: 35px auto;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .muted {
      color: #7184a3;
      margin-top: 8px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e8f5;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(30, 55, 90, 0.04);
    }

    .stat-label {
      color: #7184a3;
      font-size: 14px;
    }

    .stat-value {
      font-size: 29px;
      font-weight: 800;
      margin-top: 10px;
    }

    .trip-list {
      display: grid;
      gap: 16px;
    }

    .trip-card {
      background: #fff;
      border: 1px solid #e0e8f5;
      border-radius: 18px;
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
    }

    .trip-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .trip-info {
      color: #7184a3;
      font-size: 14px;
      line-height: 1.9;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #e4f7eb;
      color: #16804a;
      font-weight: 700;
      font-size: 12px;
      text-transform: capitalize;
    }

    .status.active {
      background: #fff1d6;
      color: #986000;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #7184a3;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .message {
      margin-bottom: 18px;
      padding: 13px 16px;
      border-radius: 12px;
      background: #fff1f0;
      color: #b42318;
      display: none;
      overflow-wrap: anywhere;
    }

    .loading {
      text-align: center;
      padding: 35px;
      color: #7184a3;
    }

    .refresh-btn {
      background: #203b66;
      color: white;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 650px) {
      header {
        padding: 18px 4%;
      }

      .brand {
        font-size: 21px;
      }

      main {
        margin-top: 25px;
      }

      h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 18px;
      }

      .trip-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="brand">🚌 BusTrack</div>
      <div class="subtitle">Driver Portal</div>
    </div>

    <a class="back-btn" href="dashboard.html">← Dashboard</a>
  </header>

  <main>
    <div class="page-heading">
      <div>
        <h1>🕘 Trip History</h1>
        <div class="muted">Un previous bus trips inga paarkalaam.</div>
      </div>

      <button class="refresh-btn" id="refreshBtn" type="button">
        ↻ Refresh
      </button>
    </div>

    <div id="errorMessage" class="message"></div>

    <section class="stats">
      <div class="card">
        <div class="stat-label">Total Trips</div>
        <div class="stat-value" id="totalTrips">—</div>
      </div>

      <div class="card">
        <div class="stat-label">Completed Trips</div>
        <div class="stat-value" id="completedTrips">—</div>
      </div>

      <div class="card">
        <div class="stat-label">Active Trips</div>
        <div class="stat-value" id="activeTrips">—</div>
      </div>
    </section>

    <section>
      <h2>Previous Trips</h2>
      <p class="muted">Latest trips first.</p>

      <div id="tripList" class="trip-list">
        <div class="card loading">Trip history load aagudhu...</div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/driver/trip-history.js"></script>
</body>
</html>
