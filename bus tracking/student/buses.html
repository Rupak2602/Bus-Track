
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Buses | BusTrack</title>

  <link rel="stylesheet" href="../css/glass.css">
  <link rel="stylesheet" href="../css/student/buses.css">
</head>
<body>
  <header class="topbar">
    <a href="dashboard.html" class="brand">
      <span class="brand-icon">🚌</span>
      <span>
        <strong>BusTrack</strong>
        <small>Student Portal</small>
      </span>
    </a>
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <span class="eyebrow">STUDENT TRANSPORT</span>
        <h1>My Buses 🚌</h1>
        <p>Find your bus and explore available transport details.</p>
      </div>
      <div class="hero-icon">🚍</div>
    </section>

    <section class="stats">
      <div class="stat-card">
        <span>Available Buses</span>
        <strong id="busCount">—</strong>
      </div>
      <div class="stat-card">
        <span>Active Buses</span>
        <strong id="activeCount">—</strong>
      </div>
    </section>

    <section class="search-panel">
      <div>
        <h2>Explore Buses</h2>
        <p>Search by bus number or bus name.</p>
      </div>
      <input
        id="busSearch"
        type="search"
        placeholder="🔎 Search buses..."
        aria-label="Search buses"
      >
    </section>

    <div id="pageMessage" class="message" role="status">
      Loading buses...
    </div>

    <section id="busGrid" class="bus-grid"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config/supabase.js"></script>
  <script src="../js/student/buses.js"></script>
</body>
</html>
